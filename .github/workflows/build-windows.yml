name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - project-review-checkpoint
    paths:
      - "src/**"
      - "tools/desktop_app.py"
      - "requirements.txt"
      - "images/Sample 1.bmp"
      - "images/Sample 2.bmp"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    if: github.ref != 'refs/heads/perf/windows-benchmark'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check application imports
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import config, interactive_pipeline, pitch_reference; print('Application imports succeeded')"

      - name: Build Windows application
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name StripeCenterline
          --paths src
          tools/desktop_app.py

      - name: Add sample images and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/StripeCenterline/images" | Out-Null

          Copy-Item "images/Sample 1.bmp" "dist/StripeCenterline/images/Sample 1.bmp"
          Copy-Item "images/Sample 2.bmp" "dist/StripeCenterline/images/Sample 2.bmp"

          @"
          Stripe Centerline Windows 版

          使用方法：
          1. 请先完整解压压缩包。
          2. 不要删除或移动 _internal 文件夹。
          3. 双击 StripeCenterline.exe 启动。
          4. 可以选择内置测试图片，也可以点击 Open image... 打开其他图片。
          5. 在图片上选择参考点，然后点击 Analyze selected point。
          6. 分析结果会显示左右相邻条纹中心线及像素距离。

          注意：
          Windows 第一次启动时可能显示“未知发布者”提示，这是因为程序没有购买数字签名。
          "@ | Set-Content -Encoding UTF8 "dist/StripeCenterline/使用说明.txt"

      - name: Show packaged files
        shell: pwsh
        run: Get-ChildItem -Recurse "dist/StripeCenterline"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: StripeCenterline-Windows
          path: dist/StripeCenterline/
          if-no-files-found: error

  build-windows-benchmark:
    if: github.ref == 'refs/heads/perf/windows-benchmark'
    runs-on: windows-latest

    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows-benchmark.txt
          python -m pip install pyinstaller

      - name: Record shared benchmark build identity
        shell: pwsh
        run: |
          @{
            source_revision = "${{ github.sha }}"
            python_version = $(python -c "import platform; print(platform.python_version())")
            numpy_version = $(python -c "import numpy; print(numpy.__version__)")
            opencv_version = $(python -c "import cv2; print(cv2.__version__)")
          } | ConvertTo-Json | Set-Content -Encoding UTF8 "benchmark_build_info.json"

      - name: Verify fixed image and benchmark runner
        run: |
          python -m unittest tests.test_windows_benchmark_runner tests.test_compare_windows_benchmarks

      - name: Build benchmark application
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name StripeCenterlineBenchmark
          --paths .
          --paths src
          --add-data "benchmark_assets/Stripe_10_e0_t221236602_v8p56736_retry.bmp;benchmark_assets"
          --add-data "benchmark_build_info.json;."
          tools/windows_benchmark_runner.py

      - name: Add A/B source bundle and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/StripeCenterlineBenchmark/source/src" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/StripeCenterlineBenchmark/source/tools" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/StripeCenterlineBenchmark/source/benchmark_assets" | Out-Null
          Copy-Item "src/*.py" "dist/StripeCenterlineBenchmark/source/src/"
          Copy-Item "tools/*.py" "dist/StripeCenterlineBenchmark/source/tools/"
          Copy-Item "benchmark_assets/Stripe_10_e0_t221236602_v8p56736_retry.bmp" "dist/StripeCenterlineBenchmark/source/benchmark_assets/"
          Copy-Item "requirements-windows-benchmark.txt" "dist/StripeCenterlineBenchmark/source/"
          Copy-Item "benchmark_build_info.json" "dist/StripeCenterlineBenchmark/source/"
          Copy-Item "run_windows_ab_benchmark.bat" "dist/StripeCenterlineBenchmark/"
          Copy-Item `
            "docs/windows_benchmark_README.txt" `
            "dist/StripeCenterlineBenchmark/README.txt"

      - name: Show packaged files
        shell: pwsh
        run: Get-ChildItem -Recurse "dist/StripeCenterlineBenchmark"

      - name: Upload Windows benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: StripeCenterline-Windows-Benchmark
          path: dist/StripeCenterlineBenchmark/
          if-no-files-found: error
